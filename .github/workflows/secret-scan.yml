name: Secret scan

# ONIX Q-009 / V-H8-2, FE twin of the API repo's secret-scan.yml (same image pin, same ranges). A separate workflow on purpose: no path filter (a docs-only push can carry a secret),
# no cancel-in-progress (a superseded push must still be scanned), plus a weekly and a manual FULL-history scan.
on:
  push:
    branches: [main, during-onix]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Per push / PR: only the new range. PR: origin/<base>..HEAD. Push: <before>..<sha>; an all-zero before
  # (new branch) scans everything reachable. fetch-depth 0 so every range resolves.
  gitleaks-range:
    name: Secret scan - new commits (gitleaks)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks detect (range)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/$BASE_REF..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          else
            RANGE="--all"
          fi
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect \
            --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose \
            --log-opts="$RANGE"

  # Weekly and on demand: the FULL history of every ref (covers cancelled, ignored and force-pushed ranges).
  gitleaks-full:
    name: Secret scan - full history (gitleaks)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks detect (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect \
            --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose \
            --log-opts=--all
